device: 'cuda'
cuda_visible_devices: '2'

model_save_path: 'results'
processed_data_dir: '/data/yg/Subgraph-MIL/Data/processed_data'
data_name: 'phy'
timestamp: phy_AB
max_num_nodes: 37  # 最大子图包含的节点个数: cora 25, citeseer 26, pubmed 47, cs 35, phy 37, eng 33, chem 39, med 35
channel_list: [8415, 30, 30, 30, 1] # 分支A改成二分类：最后一维改为1
node_list: [8415, 10, 10]  # 第一个值为特征维度，cora 1433, citeseer 3703, pubmed 500, cs 6805, phy 8415, eng 4839, chem 4877, med 5538


batch_size: 32
epoch: 20
learning_rate: 0.001
grad_clip: 2
dropout: 0.5

holdout_runs: 1             # 重复留出次数（若提供holdout_seeds则忽略此项）
holdout_seeds: [11]         # 可选：逐次运行的随机种子列表,22,33,44,55,66,77,88,99,110

branch_b:
  use: true
  attn_hidden: 128
  gate_hidden: 64
  lambda_lap: 0.0           # 初始设为0，收敛后可改为1e-3
  gamma_start: 0.3          # 初始gamma权重
  gamma_end: 0.6            # 最终gamma权重
  warmup_epochs: 20         # gamma从start到end的过渡轮数
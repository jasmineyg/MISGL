data_name_set: ['ogbn_arxiv']
timestamp: pos
channel_list: [6805, 256, 128, 64, 1]

batch_size: 64
epoch: 200
learning_rate: 0.001
dropout: 0.5
patience: 30
grad_clip: 2

branch_b:
  use: true
  attn_hidden: 128
  gate_hidden: 64
  use_structural_features: true
  structural_fusion: 'gated_residual'
  attention_shape_loss_weight: 0.05

position_head:
  use: true
  top_k: 16
  normalize: true
  include_self: false
  symmetrize: true
  type: residual_gcn
  num_layers: 1
  dropout: 0.1
  row_normalize: true
  residual_init: 0.1

export_attention: true

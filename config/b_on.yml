device: 'cuda'
cuda_visible_devices: '1'

model_save_path: 'results'
processed_data_dir: '/data/yg/Subgraph-MIL/Data/processed_data'
data_name_set: ['cs', 'eng', 'phy', 'chem', 'med']
timestamp: gat_b_transMIL
channel_list: [6805, 256, 128, 64, 1]

batch_size: 32
epoch: 200
learning_rate: 0.001
dropout: 0.5
patience: 50
grad_clip: 2

cv_split_dir: '/data/yg/Subgraph-MIL/diffpool2/splits'
cv_seed: 1024
cv_num_folds: 10
cv_val_policy: 'adjacent'
cv_use_all_samples: true

branch_b:
  use: true
  attn_hidden: 128
  gate_hidden: 64

use_coarse_graph: false
coarse_graph_topk: 16

enable_gat_export: false

data_name_set: ['flickr']
timestamp: gat
channel_list: [6805, 256, 128, 64, 1]

batch_size: 64
epoch: 200
learning_rate: 0.001
dropout: 0.5
patience: 30
grad_clip: 2

branch_b:
  use: false

position_head:
  use: false
  top_k: 16
  normalize: true
  include_self: false
  symmetrize: true
  type: residual_gcn
  num_layers: 1
  dropout: 0.1
  row_normalize: true
  residual_init: 0.1

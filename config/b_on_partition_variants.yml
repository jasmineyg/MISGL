data_name_set:
  - 'ogbn_arxiv/ogbn_arxiv_metis_perturbed_30'
  - 'ogbn_arxiv/ogbn_arxiv_metis_perturbed_50'
  - 'ogbn_arxiv/ogbn_arxiv_metis_perturbed_70'
  - 'ogbn_arxiv/ogbn_arxiv_random_balanced'
  - 'reddit/reddit_metis_perturbed_30'
  - 'reddit/reddit_metis_perturbed_50'
  - 'reddit/reddit_metis_perturbed_70'
  - 'reddit/reddit_random_balanced'
processed_data_dir: '/data/yg/Subgraph-MIL/Data/processed_data/partition_variants'
timestamp: partition_variants
channel_list: [6805, 256, 128, 64, 1]

batch_size: 64
epoch: 200
learning_rate: 0.001
dropout: 0.5
patience: 30
grad_clip: 2
loss_type: 'bce'

branch_b:
  use: true
  attn_hidden: 128
  gate_hidden: 64
  use_structural_features: true
  structural_fusion: 'gated_residual'
  attention_shape_loss_weight: 0.05

export_attention: true
